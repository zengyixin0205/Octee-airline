<desc id="fia-d">From top to bottom: the single runway 09/27 with Mount Fuji behind it; the apron with aircraft parked at twelve gates; the departures concourse with gates FIA01 to FIA12, not quite in order; the terminal with the check-in hall for Octee Airlines, One United and Scraggy Airlines on the left, security, the Octee Lounge and the One Peanut Bar in the middle, and baggage claim and a very large Lost and Found on the right; the control tower on the left and the Mount Fuji viewing deck on the right; then the drop-off road with the JOELMOBILE stop, the car park, FIA Station and the Fuji Airport Group head office. The JOELMOBILE route loops around the terminal. "You are here" appears twice.</desc>
