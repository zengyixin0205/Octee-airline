<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Octee Airlines</title>
<meta name="description" content="Contact Octee customer service. We will ignore you properly.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/main.js"></script>
<script type="module" src="js/contact.js"></script>
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="hero">
  <h1 class="headline">Contact us<span class="punch">we're listening (to something)</span></h1>
</section>
<form id="contact-form" class="card">
  <div class="row">
    <div class="field"><label for="c-name">Your name</label><input type="text" id="c-name" name="name" autocomplete="off"></div>
    <div class="field"><label for="c-topic">Topic</label><select id="c-topic" name="topic"><option>My bag</option><option>My other bag</option><option>The peanut</option><option>The engines</option><option>Compliments (rare)</option></select></div>
  </div>
  <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" name="message"></textarea></div>
  <div class="actions"><button class="btn" type="submit">Send</button></div>
  <p id="contact-msg" class="msg" role="status" aria-live="polite"></p>
  <p class="hint">Nothing is sent anywhere. This website doesn't collect your messages.</p>
</form>
</main>
<div id="site-footer"></div>
<noscript><p style="text-align:center;padding:12px">Octee needs JavaScript to fly. Like our engines, it may or may not be working.</p></noscript>
</body>
</html>
