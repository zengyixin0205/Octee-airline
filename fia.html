<main id="main">
<section class="hero">
  <h1 class="headline">Fuji International Airport<span class="punch">LOST? we will make you more lost</span></h1>
  <p class="sub">Octee's home base, part of FAG (Fuji Airport Group). Gates FIA01 to FIA12. Probably in that order.</p>
</section>
<figure class="card route-map">
  <svg viewBox="0 0 640 260" role="img" aria-labelledby="fia-t fia-d">
    <title id="fia-t">FIA terminal map</title>
    <desc id="fia-d">A deliberately confusing terminal map. Gates 1 to 12 are in a loop, arrows point both ways, and "You are here" appears twice.</desc>
    <rect x="20" y="20" width="600" height="220" rx="24" fill="#fff3e6" stroke="#2b1a0e" stroke-width="3"/>
    <path d="M60 130 C 160 40, 260 220, 360 130 S 560 40, 590 130" stroke="#ff7a00" stroke-width="6" fill="none"/>
    <g font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#2b1a0e">
      <text x="60" y="60">FIA01</text><text x="150" y="210">FIA07</text><text x="240" y="60">FIA03</text><text x="330" y="210">FIA12</text>
      <text x="420" y="60">FIA05</text><text x="510" y="210">FIA02</text><text x="540" y="60">FIA09</text><text x="90" y="210">FIA11</text>
      <text x="260" y="140" fill="#c03a3a">★ You are here</text><text x="470" y="140" fill="#c03a3a">★ You are also here</text>
      <text x="40" y="140">← Departures →</text>
    </g>
  </svg>
  <figcaption class="note" id="named-gate">Signs are updated hourly, at random.</figcaption>
</figure>
<div class="banner"><p class="headline">Need help?<span class="punch">Call the JOELMOBILE</span></p><a class="btn" href="joelmobile.html">Call the JOELMOBILE</a></div>
<h2>The official FIA taglines</h2>
<div id="gallery" class="grid"></div>
</main>
